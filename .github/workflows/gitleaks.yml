name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify scanner detects a synthetic canary
        run: |
          go version
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile

          synthetic_canary = (
              "GITLEAKS_TEST_ONLY_DO_NOT_USE=ghp_0123456789ABCDEFGH"
              "IJKLMNOPQRSTUVWXYZ"
          )
          with tempfile.TemporaryDirectory(prefix="omnipatch-gitleaks-") as temp_dir:
              canary_file = pathlib.Path(temp_dir) / "synthetic-canary.txt"
              canary_file.write_text(synthetic_canary, encoding="utf-8")
              result = subprocess.run(
                  [
                      "go",
                      "run",
                      "github.com/zricethezav/gitleaks/v8@v8.29.1",
                      "dir",
                      "--redact=100",
                      "--no-banner",
                      temp_dir,
                  ],
                  capture_output=True,
                  check=False,
                  text=True,
                  timeout=120,
              )

          output = result.stdout + result.stderr
          has_rule = "github-pat" in output
          has_finding_summary = "leaks found" in output
          is_redacted = synthetic_canary not in output
          if (
              result.returncode == 0
              or not has_rule
              or not has_finding_summary
              or not is_redacted
          ):
              safe_output = output.replace(synthetic_canary, "[REDACTED CANARY]")
              print(
                  "Canary diagnostics: "
                  f"exit={result.returncode}, rule={has_rule}, "
                  f"summary={has_finding_summary}, redacted={is_redacted}."
              )
              print(safe_output[-1000:])
              print("Gitleaks synthetic canary detection/redaction check failed.")
              sys.exit(1)
          print("Gitleaks detected the synthetic canary; output was redacted.")
          PY

      - name: Scan working tree and full Git history
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.29.1 dir --redact=100 --no-banner .
          go run github.com/zricethezav/gitleaks/v8@v8.29.1 git --redact=100 --no-banner --log-opts="--full-history --all --diff-filter=tuxdb" .

