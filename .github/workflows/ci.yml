name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run default test suite
        run: uv run --frozen python -m pytest -q

      - name: Run safe integration tests
        run: uv run --frozen python -m pytest -q -o addopts= -m "integration and not protected"

      - name: Run strict type checks
        run: uv run --frozen mypy --strict src/

      - name: Run lint and formatting checks
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Run Bandit self-scan
        run: uv run --frozen bandit -q -r src/
